<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A18"/>
      <stop offset="100%" stop-color="#0D0D0C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF5B2E" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" stroke="#FF5B2E" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Terminal Prompt > -->
  <path d="M18 20 L32 32 L18 44" fill="none" stroke="#FF5B2E" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Underscore Cursor _ -->
  <line x1="38" y1="44" x2="48" y2="44" stroke="#EDEAE2" stroke-width="5" stroke-linecap="round"/>
</svg>
